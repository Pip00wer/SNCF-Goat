[project]
name = "sncf-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
    "pydeck>=0.9.3",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
]

[project.scripts]
sncf-project = "sncf_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
